[package]
name = "ddmail"
version = "0.1.0"
edition = "2021"
description = "DDMail — Telegram-style desktop email client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-native-tls = "0.5"
async-imap = "0.10"
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
mailparse = "0.15"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
md-5 = "0.10"
reqwest = { version = "0.12", features = ["native-tls", "json"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
url = "2"
urlencoding = "2"
base64 = "0.22"
async-trait = "0.1"

# Linux-only: implement StatusNotifierItem directly so KDE / GNOME (with
# the AppIndicator extension) deliver left-click and right-click as
# separate events. Tauri's bundled tray-icon backend goes through
# libappindicator which collapses every click into "show menu", which is
# the limitation we work around here.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"
# Reminders rendering — speaks org.freedesktop.Notifications over D-Bus.
# Supports action arrays and the conventional `default` action for body
# clicks; both are what the calendar reminders need on KDE / dunst.
notify-rust = "4"
