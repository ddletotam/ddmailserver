[package]
name = "ddmail-core"
version = "0.1.0"
edition = "2024"

# UI-agnostic mail engine (data model, cache, IMAP/SMTP/native providers),
# extracted from the retired Tauri crate. No UI/Tauri dependencies.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# rustls, not OpenSSL: the desktop client ships for Windows and Linux, and a
# system TLS library is the thing that breaks a Linux build first. Roots come
# from the OS store (rustls-native-certs) so corporate CAs keep working.
futures-rustls = "0.26"
rustls = "0.23"
rustls-native-certs = "0.8"
async-imap = "0.10"
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport", "hostname", "webpki-roots"] }
mailparse = "0.15"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots-no-provider", "json", "charset", "http2"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
url = "2"
urlencoding = "2"
base64 = "0.22"
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
# ShellExecuteW — открыть URL/файл системным обработчиком без шелла между
# нами и им (почему не `cmd /C start` — см. src/shellopen.rs). Версия та же,
# что у клиента (desktop/native), так что крейт собирается один раз.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
