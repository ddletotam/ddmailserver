[package]
name = "ddmail-core"
version = "0.1.0"
edition = "2024"

# UI-agnostic engine shared by the native client. Today: data model + cache
# reader. Will grow to hold the IMAP/SMTP/provider engine extracted from the
# (retired) Tauri crate.

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
