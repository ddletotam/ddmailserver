[package]
name = "ddmail-native"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ddmail-native"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.13"

[dependencies]
slint = "1.13"

# Shared engine (data model, cache, IMAP/SMTP/native providers).
ddmail-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"

# Decode avatar bytes (png/jpeg/…) to RGBA for Slint.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# "Today / DD.MM / DD.MM.YY" date formatter for the search-dropdown rows.
# ddmail-core already pulls chrono; we declare it explicitly here too so
# the dependency is honest in our crate manifest.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Cross-platform desktop notifications (Linux zbus / Windows WinRT toast /
# macOS NSUserNotification) behind one API — fired on new-mail events.
notify-rust = "4"

# Regex passes for sanitizing inbound email HTML before it reaches the
# Ultralight renderer (strip <script>, <iframe>, MS Outlook conditionals,
# event handlers — they confuse the old WebKit fork and cost us bubbles
# that quietly render blank).
regex = "1"

# Persisted content-permission policy (per-sender media/scripts toggles,
# allow-listed domains). Stored as JSON via serde_json (declared above)
# next to the cache db; serde-derive used for the policy/window-state structs.
serde = { version = "1", features = ["derive"] }

# ── Platform body-render backends (only render_* differs per OS) ──

# Linux: real WebKitGTK (libwebkit2gtk-4.1) → offscreen snapshot → RGBA.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
gtk = "0.18"
glib = "0.18"
gio = "0.18"
cairo-rs = "0.18"
javascriptcore-rs = "1"

# Windows: WebView2 (Edge/Chromium) → offscreen CapturePreview(PNG) → RGBA.
[target.'cfg(windows)'.dependencies]
# System-tray icon + menu (Linux tray deferred — it needs gtk on the main
# thread, which conflicts with our render worker's gtk; the Linux dev wires
# it separately).
tray-icon = "0.19"
webview2-com = "0.33"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
