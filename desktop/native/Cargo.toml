[package]
name = "ddmail-native"
# Kept in sync with installer/ddmail.iss AppVersion — bump both together
# (docs/desktop-behavior-contract.md §7).
version = "0.1.10"
edition = "2024"

[[bin]]
name = "ddmail-native"
path = "src/main.rs"

[profile.release]
# Installer builds: thin LTO + stripped symbols roughly halve the exe size
# at a small compile-time cost; panics still print (abort not set).
lto = "thin"
strip = "symbols"

[build-dependencies]
slint-build = "1.13"

[target.'cfg(windows)'.build-dependencies]
# Embeds assets/ddmail.ico into the exe (see build.rs).
winresource = "0.1"

[dependencies]
# raw-window-handle-06 exposes the OS window handle (HasWindowHandle), which
# we hand to rfd's set_parent so the file dialog opens in front + modal.
slint = { version = "1.13", features = ["raw-window-handle-06"] }

# The one and only body-render path on both platforms — there is no browser
# engine in this build and no flag that brings one back.
# `net`: a permitted sender's remote images are fetched inside the crate,
# because the render-lab harness needs the same fetcher.
emlrender = { path = "../emlrender", features = ["net"] }

# Shared engine (data model, cache, IMAP/SMTP/native providers).
ddmail-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
log = "0.4"

# Decode avatar bytes to RGBA for Slint. ico/bmp matter: the server's
# avatar chain ends at /favicon.ico, and Chromium (the old Tauri webview)
# happily rendered those — the native decoder must too.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico", "bmp"] }

# Rasterize SVG avatars (BIMI logos are SVG by spec). default-features off
# drops text shaping / system fonts — brand logos are pure vector shapes.
resvg = { version = "0.44", default-features = false }

# "Today / DD.MM / DD.MM.YY" date formatter for the search-dropdown rows.
# ddmail-core already pulls chrono; we declare it explicitly here too so
# the dependency is honest in our crate manifest.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Cross-platform desktop notifications (Linux zbus / Windows WinRT toast /
# macOS NSUserNotification) behind one API — fired on new-mail events.
notify-rust = "4"

# Single-instance guard (named mutex on Windows / lock file on Linux) so a
# second launch exits instead of opening a duplicate window.
single-instance = "0.3"

# Already in the tree via slint's raw-window-handle-06 feature; declared
# directly so we can match RawWindowHandle::Win32 to raise/focus the window
# from tray and toast clicks (plain slint show() can't un-minimize).
raw-window-handle = "0.6"

# Regex passes for sanitizing inbound email HTML before it reaches `emlrender`
# (strip <script>, <iframe>, MS Outlook conditionals, event handlers — the
# renderer ignores them, but dropping them early keeps the layout honest and
# the permission gate simple).
regex = "1"
# System clipboard for text selection / context-menu copy.
arboard = "3"

# Persisted content-permission policy (per-sender media/scripts toggles,
# allow-listed domains). Stored as JSON via serde_json (declared above)
# next to the cache db; serde-derive used for the policy/window-state structs.
serde = { version = "1", features = ["derive"] }
cosmic-text = "0.19.0"

# ── Platform integration (tray, window activation, file dialogs) ──

# Native file dialogs, everywhere except Linux. rfd's synchronous API needs the
# gtk3 backend on Linux (the default xdg-portal one is async-only), and linking
# gtk for a file dialog is exactly what dropping WebKitGTK got rid of — so Linux
# shells out to kdialog/zenity instead (see `pick_attachment_files` in main.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# System tray via StatusNotifierItem (KDE/Plasma native). ksni runs its own
# D-Bus service on a background thread and never touches gtk — with the
# WebKitGTK backend gone there is no gtk in the process at all.
ksni = "0.2"
# Raise + focus the window from tray/toast clicks on X11. plain Slint show()
# is a no-op for an already-mapped window; we send _NET_ACTIVE_WINDOW (EWMH)
# from a throwaway display connection, the Linux analogue of Win32
# SetForegroundWindow.
x11 = { version = "2", features = ["xlib"] }

[target.'cfg(windows)'.dependencies]
# System-tray icon + menu.
tray-icon = "0.19"
# WinRT toast with in-process on_activated (click-through works while the
# app is running; no AUMID/COM activator needed). Standalone, no tauri dep.
tauri-winrt-notification = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
