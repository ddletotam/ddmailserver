[package]
name = "ddmail-native"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ddmail-native"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.13"

[dependencies]
# raw-window-handle-06 exposes the OS window handle (HasWindowHandle), which
# we hand to rfd's set_parent so the file dialog opens in front + modal.
slint = { version = "1.13", features = ["raw-window-handle-06"] }

# Shared engine (data model, cache, IMAP/SMTP/native providers).
ddmail-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
log = "0.4"

# Decode avatar bytes to RGBA for Slint. ico/bmp matter: the server's
# avatar chain ends at /favicon.ico, and Chromium (the old Tauri webview)
# happily rendered those вЂ” the native decoder must too.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico", "bmp"] }

# Rasterize SVG avatars (BIMI logos are SVG by spec). default-features off
# drops text shaping / system fonts вЂ” brand logos are pure vector shapes.
resvg = { version = "0.44", default-features = false }

# "Today / DD.MM / DD.MM.YY" date formatter for the search-dropdown rows.
# ddmail-core already pulls chrono; we declare it explicitly here too so
# the dependency is honest in our crate manifest.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Cross-platform desktop notifications (Linux zbus / Windows WinRT toast /
# macOS NSUserNotification) behind one API вЂ” fired on new-mail events.
notify-rust = "4"

# Single-instance guard (named mutex on Windows / lock file on Linux) so a
# second launch exits instead of opening a duplicate window.
single-instance = "0.3"

# Native file-open dialog for the composer's attach button. We call the
# blocking API on the UI thread вЂ” the OS dialog is modal anyway. Windows uses
# the built-in Win32 backend (no feature needed); Linux needs the gtk3 backend
# for the sync API (declared in the linux target block below).
rfd = { version = "0.15", default-features = false }

# Already in the tree via slint's raw-window-handle-06 feature; declared
# directly so we can match RawWindowHandle::Win32 to raise/focus the window
# from tray and toast clicks (plain slint show() can't un-minimize).
raw-window-handle = "0.6"

# Regex passes for sanitizing inbound email HTML before it reaches the
# Ultralight renderer (strip <script>, <iframe>, MS Outlook conditionals,
# event handlers вЂ” they confuse the old WebKit fork and cost us bubbles
# that quietly render blank).
regex = "1"
# System clipboard for text selection / context-menu copy.
arboard = "3"

# Persisted content-permission policy (per-sender media/scripts toggles,
# allow-listed domains). Stored as JSON via serde_json (declared above)
# next to the cache db; serde-derive used for the policy/window-state structs.
serde = { version = "1", features = ["derive"] }

# в”Ђв”Ђ Platform body-render backends (only render_* differs per OS) в”Ђв”Ђ

# Linux: real WebKitGTK (libwebkit2gtk-4.1) в†’ offscreen snapshot в†’ RGBA.
[target.'cfg(target_os = "linux")'.dependencies]
# Sync file dialog on Linux needs the gtk3 backend (default xdg-portal is
# async-only). gtk 0.18 already in our Linux deps, so no new toolkit.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }
gtk = "0.18"
glib = "0.18"
gio = "0.18"
cairo-rs = "0.18"
javascriptcore-rs = "1"
# System tray via StatusNotifierItem (KDE/Plasma native). ksni runs its own
# D-Bus service on a background thread and never touches gtk — so, unlike the
# Windows tray-icon, it doesn't fight the WebKitGTK render worker's gtk loop.
ksni = "0.2"
# Raise + focus the window from tray/toast clicks on X11. plain Slint show()
# is a no-op for an already-mapped window; we send _NET_ACTIVE_WINDOW (EWMH)
# from a throwaway display connection, the Linux analogue of Win32
# SetForegroundWindow.
x11 = { version = "2", features = ["xlib"] }

# Windows: WebView2 (Edge/Chromium) в†’ offscreen CapturePreview(PNG) в†’ RGBA.
[target.'cfg(windows)'.dependencies]
# System-tray icon + menu (Linux tray deferred вЂ” it needs gtk on the main
# thread, which conflicts with our render worker's gtk; the Linux dev wires
# it separately).
tray-icon = "0.19"
# WinRT toast with in-process on_activated (click-through works while the
# app is running; no AUMID/COM activator needed). Standalone, no tauri dep.
tauri-winrt-notification = "0.7"
webview2-com = "0.33"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
