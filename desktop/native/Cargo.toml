[package]
name = "ddmail-native"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ddmail-native"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.13"

[dependencies]
slint = "1.13"

# HTML body renderer: Ultralight (WebKit) → offscreen bitmap. Windows-only crate
# for now (Linux needs its own FFI against the official SDK).
ultralight = { version = "0.1.7", features = ["requires_dll", "image"] }
png = "0.17"

# Shared engine (data model, cache, IMAP/SMTP/native providers).
ddmail-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread"] }

# Decode avatar bytes (png/jpeg/…) to RGBA for Slint.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
