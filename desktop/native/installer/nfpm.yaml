# Пакеты .deb и .rpm для Linux. Собирает build-packages.sh — он же кладёт
# файлы в $STAGE и задаёт VERSION; руками nfpm не запускать.
name: ddmail
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: mail
priority: optional
maintainer: DDMail <support@lunlun.email>
vendor: DDMail
homepage: https://lunlun.email/apps.html
license: Proprietary
description: |-
  Почта как мессенджер
  Почтовый клиент DDMail: беседы вместо списка писем, работает с любым
  IMAP/SMTP-сервером.

contents:
  - src: ${STAGE}/ddmail-native
    dst: /usr/bin/ddmail-native
    file_info: { mode: 0755 }
  - src: ${STAGE}/ddmail.desktop
    dst: /usr/share/applications/ddmail.desktop
    file_info: { mode: 0644 }
  - src: ${STAGE}/ddmail.svg
    dst: /usr/share/icons/hicolor/scalable/apps/ddmail.svg
    file_info: { mode: 0644 }
  - src: ${STAGE}/ddmail.png
    dst: /usr/share/icons/hicolor/256x256/apps/ddmail.png
    file_info: { mode: 0644 }

scripts:
  postinstall: ${STAGE}/refresh-caches.sh
  postremove: ${STAGE}/refresh-caches.sh

# Бинарь собран под glibc 2.31 (build-packages.sh): Debian 11+, Ubuntu 20.04+,
# RHEL 9+, Fedora. Прямые зависимости — dbus, X11, fontconfig; xkbcommon-x11
# грузится на лету (раскладки под X11), без неё клиент запускается.
overrides:
  deb:
    depends: [libc6 (>= 2.31), libdbus-1-3, libx11-6, libfontconfig1]
    recommends: [libxkbcommon-x11-0, xdg-utils]
  rpm:
    depends: [glibc >= 2.31, dbus-libs, libX11, fontconfig]
    recommends: [libxkbcommon-x11, xdg-utils]
