# Проект Xcode генерируется отсюда (XcodeGen): `DDMail.xcodeproj` в git не
# хранится — контракт §1. Сборка — `scripts/mac.sh` на Маке по SSH.
name: DDMail

options:
  bundleIdPrefix: ru.letotam
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Версия бампается при любой правке клиента (контракт §1).
    MARKETING_VERSION: "0.0.10"
    CURRENT_PROJECT_VERSION: "10"
    # Команда подписи не в git: mac.sh берёт её из ~/.config/ddmail-ios/team
    # станции (или из учётки Xcode на Маке).
    CODE_SIGN_STYLE: Automatic
    ALWAYS_SEARCH_USER_PATHS: NO
    # App Group (контракт §7): на iOS — `group.…` (зарегистрирована в
    # портале и назначена обоим App ID); на macOS — с префиксом команды: такую
    # группу система разрешает без записи в профиле и без запроса пользователю.
    DDMAIL_APP_GROUP: group.ru.letotam.ddmail
    "DDMAIL_APP_GROUP[sdk=macosx*]": $(TeamIdentifierPrefix)ru.letotam.ddmail
  # Окружение APNs (контракт §7): право `aps-environment` и то, что
  # приложение сообщает серверу при регистрации токена (sandbox/production).
  configs:
    Debug:
      DDMAIL_APS_ENVIRONMENT: development
    Release:
      DDMAIL_APS_ENVIRONMENT: production

packages:
  DDMailKit:
    path: DDMailKit

targets:
  DDMail:
    type: application
    # `auto` + список назначений — одна цель на iOS/iPadOS и нативный macOS
    # (не Catalyst, контракт §0).
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      # Документ ленты беседы — общий с Android (§8): каталогом в ресурсы.
      - path: ../shared/conversation-doc
        type: folder
        buildPhase: resources
    # Права — файлами по платформе (в git): у push на iOS и macOS разные
    # ключи (`aps-environment` и `com.apple.developer.aps-environment`), а
    # XcodeGen генерирует один файл на цель. Общие с расширением (§7): App
    # Group с кэшем и учётками, группа связки ключей с сессиями (на macOS без
    # явной группы SecItemAdd отвечает errSecMissingEntitlement, §2).
    # Возможности — как их ставит редактор Signing & Capabilities: по ним
    # автоматическая подпись регистрирует App Group и включает push у App ID.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS: {enabled: 1}
        com.apple.ApplicationGroups.Mac: {enabled: 1}
        com.apple.Push: {enabled: 1}
        com.apple.Keychain: {enabled: 1}
    info:
      # Генерируется XcodeGen; ключи, которых нет у INFOPLIST_KEY_*.
      path: App/Info.plist
      properties:
        # Только светлое оформление, как у десктопа (desktop §5ж, mobile-layout.md):
        # цвета айдентик в списке — пастель под тёмный текст; системная тёмная
        # тема делала текст белым на пастели — «ни хера не читается».
        UIUserInterfaceStyle: Light
        BGTaskSchedulerPermittedIdentifiers:
          - ru.letotam.ddmail.refresh
          - ru.letotam.ddmail.prefetch
        UIBackgroundModes: [fetch, processing]
        # Какое окружение APNs у токена этой сборки — серверу при регистрации.
        DDMailAPSEnvironment: $(DDMAIL_APS_ENVIRONMENT)
        DDMailAppGroup: $(DDMAIL_APP_GROUP)
    dependencies:
      - package: DDMailKit
        products: [DDMailAPI, DDMailAuth, DDMailStore, DDMailSync, DDMailCalendar, DDMailMIME, DDMailNet, DDMailIMAP, DDMailSMTP, DDMailDAV, DDMailPush]
      # Notification Service Extension (§7) — в PlugIns приложения.
      - target: DDMailNotificationService
    settings:
      base:
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/DDMail-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/DDMail-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/DDMail-macOS.entitlements
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        PRODUCT_BUNDLE_IDENTIFIER: ru.letotam.ddmail
        PRODUCT_NAME: DDMail
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DDMail
        # Иконка — рисунок десктопа (desktop/native/assets/ddmail_icon.png): облачко на зелёном.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Mac: песочница, из сети — только исходящие соединения.
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES

  # Notification Service Extension (контракт §7): видимый push с обезличенным
  # текстом будит его до показа; дельта-синк ddmail-учёток в общий кэш App
  # Group и настоящий текст (отправитель, тема) из кэша.
  DDMailNotificationService:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NotificationService
        excludes: ["*.entitlements", "Info.plist"]
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS: {enabled: 1}
        com.apple.ApplicationGroups.Mac: {enabled: 1}
        com.apple.Keychain: {enabled: 1}
    info:
      path: NotificationService/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        DDMailAppGroup: $(DDMAIL_APP_GROUP)
    dependencies:
      - package: DDMailKit
        products: [DDMailAPI, DDMailAuth, DDMailPush, DDMailStore, DDMailSync]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.letotam.ddmail.NotificationService
        PRODUCT_NAME: DDMailNotificationService
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DDMail
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": NotificationService/NotificationService-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": NotificationService/NotificationService-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": NotificationService/NotificationService-macOS.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES

  # Сквозные сценарии в симуляторе (mac.sh uitest). Учётные данные — только
  # из окружения запуска, в репозитории их нет.
  DDMailUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
    dependencies:
      - target: DDMail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.letotam.ddmail.uitests
        PRODUCT_NAME: DDMailUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DDMail

schemes:
  DDMail:
    build:
      targets:
        DDMail: all
    test:
      config: Debug
      targets:
        - DDMailUITests
