server:
  # IMAP server configuration (for email clients to connect)
  imap_port: 1143
  imap_tls_port: 1993

  # SMTP server configuration (for email clients to send)
  smtp_port: 1587
  smtp_tls_port: 1465

  # SMTP MX server (for receiving external mail, port 25)
  smtp_mx_port: 25

  # Web interface and API
  web_port: 8080
  web_host: "0.0.0.0"

  # Web UI language (en, ru)
  locale: "en"

  # Internet-facing endpoints (device profiles, OAuth redirect URIs, cookies).
  # public:
  #   hostname: "mail.example.com"   # defaults to server.domain
  #   # Secure flag on session/OAuth cookies: auto (default: Secure unless the
  #   # request is known to be plain HTTP or local), true, or false.
  #   secure_cookies: auto

database:
  host: "localhost"
  port: 5432
  user: "mailserver"
  password: "changeme"
  dbname: "mailserver"
  sslmode: "disable"

# Security settings
security:
  # JWT secret for web authentication
  jwt_secret: "change-this-secret-key"

  # TLS certificates (optional, for encrypted connections)
  tls_cert: ""
  tls_key: ""

  # Proxies whose X-Forwarded-For / X-Real-IP / X-Forwarded-Host headers are
  # trusted (IPs or CIDRs). Omit to trust loopback only (nginx on this host);
  # an explicit empty list [] trusts nobody.
  # trusted_proxies: ["127.0.0.0/8", "::1/128"]

  # Failed-login throttling shared by web, desktop API, IMAP, SMTP, CalDAV
  # and CardDAV. Repeating the same wrong password counts once; an IP that
  # logged in successfully is exempt from that user's username block.
  # auth_limit:
  #   max_failures_per_ip: 10    # per IPv4 address / IPv6 /64
  #   max_failures_per_user: 10
  #   window: 15m
  #   block_duration: 15m
  #   known_ip_ttl: 168h

# Sync settings
sync:
  # How often to check for new emails (in seconds)
  interval: 60

  # Maximum concurrent IMAP connections per account
  max_connections: 5

# Worker pool settings
workers:
  # CPU usage limit in percent (1-100)
  cpu_limit: 50

  # Percentage of workers dedicated to IMAP tasks (rest goes to SMTP)
  imap_worker_percent: 50

  # Task queue size (buffered channel size)
  queue_size: 1000

# Logging
logging:
  level: "info"  # debug, info, warn, error
  format: "json" # json, text
